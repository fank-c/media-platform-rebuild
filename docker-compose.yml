services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: media-platform-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks: [media-platform]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: media-platform-rabbitmq
    environment:
      # 与业务服务的 RABBITMQ_USERNAME/PASSWORD 共用变量，避免初始化账户和连接账户偏离。
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-media}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-media}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [media-platform]

  mysql:
    image: mysql:8.4
    container_name: media-platform-mysql
    environment:
      # 第一阶段共用实例和数据库；表级所有权由各服务的前缀与访问边界保证。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-media_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-media_platform}
      MYSQL_USER: ${MYSQL_USER:-media}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-media}
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [media-platform]

  redis:
    image: redis:7.2-alpine
    container_name: media-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [media-platform]

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: media-platform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [media-platform]

networks:
  media-platform:
    name: media-platform

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:

# file-service 复用现有 MinIO；初始化专用私有 bucket 与最小权限账号须在隔离环境显式执行。
# 业务服务容器尚未在本 Compose 自动启动，避免把签名直传或端口暴露误当作上线授权。
