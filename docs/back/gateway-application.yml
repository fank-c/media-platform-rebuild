server:
  port: ${GATEWAY_SERVER_PORT:8000}

spring:
  application:
    name: gateway-service
  config:
    import:
      # 导入 Nacos 远程配置中心中的网关配置，并开启动态刷新
      - "optional:nacos:MPR-Gateway-dev.yaml?refreshEnabled=true"
  data:
    redis:
      # 网关仅将 Redis 用于 Token 验证结果缓存，不保存完整 Token。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:d84607c303bbf9e48aa48d0c2d5c67f31c3ab669e32b67e9}
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/content/**
        # 文件业务 API 仍经认证网关；MinIO 对象传输仅使用受控短期签名例外。
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/api/interactions/**
        - id: recommend-service
          uri: lb://recommend-service
          predicates:
            - Path=/api/recommend/**

gateway:
  auth:
    # 认证服务通过 Nacos 服务发现解析，避免网关固定绑定单个实例。
    auth-service-url: ${GATEWAY_AUTH_SERVICE_URL:lb://auth-service}
    cache-ttl: ${GATEWAY_AUTH_CACHE_TTL:10m}
    whitelist:
      - /api/auth/ping
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /actuator/health
      - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # 控制台彩色输出：时间/线程弱化(faint)、级别自适应着色(%5p)、traceId洋红高亮(magenta)、类名青色(cyan)
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
