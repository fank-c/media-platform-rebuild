server:
  # 文件服务建议单独监听 8700；生产入口仍应仅由网关暴露。
  port: ${FILE_SERVER_PORT:8700}
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: file-service
  config:
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos_password}
  datasource:
    # file-service 是 file_* 表唯一所有者；凭据不设置开发默认值，避免误连共享库。
    url: ${FILE_DB_URL:jdbc:mysql://localhost:3306/media_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${FILE_DB_USERNAME:}
    password: ${FILE_DB_PASSWORD:}
  servlet:
    multipart:
      # Servlet 层先限流，仍由应用层按字节核验，防止绕开声明大小。
      max-file-size: ${FILE_MAX_MULTIPART_SIZE:200MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:210MB}
      # 超过 2MB 的切片直接写入磁盘临时文件，防止大文件吃满 JVM 堆内存导致 OOM
      file-size-threshold: ${FILE_MULTIPART_THRESHOLD:2MB}
file:
  storage:
    type: ${FILE_STORAGE_TYPE:ALIYUN_OSS}
    # HTTP 客户端超时限制不可达或慢对象占用确认线程；SDK 取消语义仍需隔离联调。
    connect-timeout: ${FILE_STORAGE_CONNECT_TIMEOUT:3s}
    read-timeout: ${FILE_STORAGE_READ_TIMEOUT:15s}
    call-timeout: ${FILE_STORAGE_CALL_TIMEOUT:180s}
    oss:
      endpoint: ${FILE_ALIYUN_OSS_ENDPOINT:${FILE_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}}
      presign-endpoint: ${FILE_ALIYUN_OSS_PRESIGN_ENDPOINT:${FILE_OSS_PRESIGN_ENDPOINT:${file.storage.oss.endpoint}}}
      region: ${FILE_ALIYUN_OSS_REGION:${FILE_OSS_REGION:cn-beijing}}
      bucket: ${FILE_ALIYUN_OSS_BUCKET:${FILE_OSS_BUCKET:cell-cloud}}
      # 存储桶内多项目/数据路径隔离前缀：item/{item-name}/...
      item-name: ${FILE_ALIYUN_OSS_ITEM_NAME:${FILE_OSS_ITEM_NAME:media-platform}}
      root-prefix: ${FILE_ALIYUN_OSS_ROOT_PREFIX:${FILE_OSS_ROOT_PREFIX:item/${file.storage.oss.item-name}}}
      # V2 PUT 只能写入暂存前缀；完成后由服务端 copy 到 permanent，两个前缀不可嵌套。
      staging-prefix: ${FILE_ALIYUN_OSS_STAGING_PREFIX:${FILE_OSS_STAGING_PREFIX:staging}}
      permanent-prefix: ${FILE_ALIYUN_OSS_PERMANENT_PREFIX:${FILE_OSS_PERMANENT_PREFIX:permanent}}
      access-key-id: ${FILE_ALIYUN_OSS_ACCESS_KEY_ID:${FILE_OSS_ACCESS_KEY_ID:${FILE_OSS_ACCESS_KEY:${ALIYUN_ACCESS_KEY_ID:}}}}
      access-key-secret: ${FILE_ALIYUN_OSS_ACCESS_KEY_SECRET:${FILE_OSS_ACCESS_KEY_SECRET:${FILE_OSS_SECRET_KEY:${ALIYUN_ACCESS_KEY_SECRET:}}}}
    minio:
      endpoint: ${FILE_MINIO_ENDPOINT:http://localhost:9000}
      presign-endpoint: ${FILE_MINIO_PRESIGN_ENDPOINT:http://localhost:9000}
      bucket: ${FILE_MINIO_BUCKET:media-files-dev}
      staging-prefix: ${FILE_MINIO_STAGING_PREFIX:staging}
      permanent-prefix: ${FILE_MINIO_PERMANENT_PREFIX:permanent}
      access-key: ${FILE_MINIO_ACCESS_KEY:}
      secret-key: ${FILE_MINIO_SECRET_KEY:}
  max-size: ${FILE_MAX_SIZE:536870912}
  put-ttl: ${FILE_PUT_TTL:15m}
  upload-ttl: ${FILE_UPLOAD_TTL:30m}
  get-ttl: ${FILE_GET_TTL:2m}
  stream-buffer-size: ${FILE_STREAM_BUFFER_SIZE:65536}
  security:
    # 静态资源防盗链与时效签名 Token 密钥
    token-secret: ${FILE_SECURITY_TOKEN_SECRET:media_platform_secure_resource_asset_token_secret_2026}
    # 资源直链签名默认有效时长
    default-ttl: ${FILE_SECURITY_DEFAULT_TTL:30m}
  proxy:
    # 允许后端流式代理的最大字节数，默认 20MB (20971520字节)，超出拒绝代理以保护微服务带宽
    max-size: ${FILE_PROXY_MAX_SIZE:20971520}
    # 浏览器本地缓存有效时间
    cache-max-age: ${FILE_PROXY_CACHE_MAX_AGE:1h}
  direct-upload-v2:
    # 默认关闭；需先在隔离 MinIO/OSS 完成 checksum、条件 copy、CORS 与生命周期 POC。
    enabled: ${FILE_DIRECT_UPLOAD_V2_ENABLED:false}
  confirm:
    threads: ${FILE_CONFIRM_THREADS:2}
    queue-capacity: ${FILE_CONFIRM_QUEUE_CAPACITY:16}
    task-timeout: ${FILE_CONFIRM_TASK_TIMEOUT:180s}
  cleanup:
    enabled: ${FILE_CLEANUP_ENABLED:false}
    # 清理扫描延迟毫秒数；@Scheduled 注解要求纯数字字符串，默认 60000ms (60s)
    interval: ${FILE_CLEANUP_INTERVAL:60000}
    batch-size: ${FILE_CLEANUP_BATCH_SIZE:100}
    max-batches: ${FILE_CLEANUP_MAX_BATCHES:5}
    run-timeout: ${FILE_CLEANUP_RUN_TIMEOUT:30s}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # 元数据必须依赖 MySQL；OSS 短暂故障由文件操作返回明确失败，不触发存活重启。
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # 控制台彩色输出：时间/线程弱化(faint)、级别自适应着色(%5p)、traceId洋红高亮(magenta)、类名青色(cyan)
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
