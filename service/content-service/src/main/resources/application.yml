# content-service 内容微服务配置文件
server:
  # 服务 HTTP 监听端口；默认 8300，可通过环境变量 CONTENT_SERVER_PORT 灵活调整
  port: ${CONTENT_SERVER_PORT:8300}

spring:
  threads:
    virtual:
      enabled: true
  application:
    # 微服务名称，用于 Nacos 服务注册、OpenFeign 远程调用寻址以及分布式链路追踪识别
    name: content-service
  config:
    # 显式声明导入 Nacos 配置中心上的全局共享配置 application.yml（遵守 Nacos 导入规范，防止启动报错）
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        # Nacos 服务注册与发现中心通信地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        # Nacos 动态配置管理中心通信地址及安全鉴权凭据
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos_password}
  datasource:
    # 数据库连接配置：第一阶段过渡期在同一 MySQL 实例中共存，表前缀独立隔离 (video_*, content_*)；
    # 提供 CONTENT_DB_* 环境变量覆盖入口，为后续微服务独立拆库留出平滑过渡路径。
    url: ${CONTENT_DB_URL:jdbc:mysql://localhost:3306/media_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${CONTENT_DB_USERNAME:media}
    password: ${CONTENT_DB_PASSWORD:media}
  rabbitmq:
    # RabbitMQ 消息代理通信连接配置，发布端开启 Publisher Confirm 与 Mandatory 校验，保障 Outbox 投递可靠性
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:media}
    password: ${RABBITMQ_PASSWORD:media}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

content:
  outbox:
    # 是否启用发件箱调度与投递总开关
    enabled: ${CONTENT_OUTBOX_ENABLED:true}
    # 是否启用事务提交后毫秒级快速内存通知投递
    fast-dispatch-enabled: ${CONTENT_OUTBOX_FAST_DISPATCH_ENABLED:true}
    # 单次补偿扫描发现的候选记录批次上限
    batch-size: ${CONTENT_OUTBOX_BATCH_SIZE:100}
    # 单条消息最大允许投递重试次数上限，超限后状态机收敛至 FAILED 待人工告警处理
    max-attempts: ${CONTENT_OUTBOX_MAX_ATTEMPTS:20}
    # 等待 RabbitMQ Broker 确认投递 ACK 的超时时间
    confirm-timeout: ${CONTENT_OUTBOX_CONFIRM_TIMEOUT:5s}
    # 消息抢占分布式租约过期时间，避免单实例宕机导致消息永久被锁定
    lease: ${CONTENT_OUTBOX_LEASE:30s}
    # 定时补偿自愈扫描固定间隔毫秒数（纯数字字符串）
    poll-interval: ${CONTENT_OUTBOX_POLL_INTERVAL:1000}
    # 优雅停机等待在途分发任务完成的超时时长
    shutdown-await: ${CONTENT_OUTBOX_SHUTDOWN_AWAIT:10s}

management:
  endpoints:
    web:
      exposure:
        # 暴露轻量健康检查与应用基础信息端点，供 K8s 存活/就绪探针以及网关健康检查探测
        include: health,info

logging:
  pattern:
    # 控制台彩色日志输出：时间/线程弱化(faint)、级别自适应着色(%5p)、traceId洋红高亮(magenta)、类名青色(cyan)
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
