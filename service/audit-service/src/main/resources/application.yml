server:
  port: ${AUDIT_SERVER_PORT:8400}
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: audit-service
  config:
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos_password}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:media}
    password: ${RABBITMQ_PASSWORD:media}
  datasource:
    # 数据库连接配置：第一阶段共用同一 MySQL 实例，通过 audit_* 前缀隔离表所有权
    url: ${AUDIT_DB_URL:jdbc:mysql://localhost:3306/media_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${AUDIT_DB_USERNAME:media}
    password: ${AUDIT_DB_PASSWORD:media}

# 审核业务定制配置
audit:
  callback:
    # 回调内容服务超时重试最大次数
    max-retries: 5
    # 僵死未回调补偿重试定时扫描间隔 (毫秒，默认 30 秒)
    retry-interval-ms: 30000
  aliyun:
    # 是否开启阿里云内容安全 2.0 增强版检测（默认 false，回退为本地规则测试桩）
    enabled: ${AUDIT_ALIYUN_ENABLED:false}
    access-key-id: ${AUDIT_ALIYUN_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
    access-key-secret: ${AUDIT_ALIYUN_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
    endpoint: ${AUDIT_ALIYUN_ENDPOINT:green-cip.cn-shanghai.aliyuncs.com}
    uid: ${AUDIT_ALIYUN_UID:}
    callback-url: ${AUDIT_ALIYUN_CALLBACK_URL:}
    callback-seed: ${AUDIT_ALIYUN_CALLBACK_SEED:}
    image-service: ${AUDIT_ALIYUN_IMAGE_SERVICE:baselineCheck}
    # 阿里云视频文件审核 Service 使用驼峰名称，必须与远端接口契约一致。
    video-service: ${AUDIT_ALIYUN_VIDEO_SERVICE:videoDetection}
    poll-timeout-seconds: ${AUDIT_ALIYUN_POLL_TIMEOUT_SECONDS:15}
    short-probe-timeout-seconds: ${AUDIT_ALIYUN_SHORT_PROBE_TIMEOUT_SECONDS:3}
    # 定时对账扫描任务执行间隔 (毫秒，默认 15000ms / 15s)
    reconcile-interval-ms: ${AUDIT_ALIYUN_RECONCILE_INTERVAL_MS:15000}
    # 动态超时预算参数：基准底噪 30s、时长系数 0.6、下限 45s、上限 600s
    base-timeout-seconds: ${AUDIT_ALIYUN_BASE_TIMEOUT_SECONDS:30}
    duration-ratio: ${AUDIT_ALIYUN_DURATION_RATIO:0.6}
    min-timeout-seconds: ${AUDIT_ALIYUN_MIN_TIMEOUT_SECONDS:45}
    max-timeout-seconds: ${AUDIT_ALIYUN_MAX_TIMEOUT_SECONDS:600}
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # 控制台彩色输出：时间/线程弱化(faint)、级别自适应着色(%5p)、traceId洋红高亮(magenta)、类名青色(cyan)
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
