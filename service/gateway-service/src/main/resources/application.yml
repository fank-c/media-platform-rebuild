server:
  # 网关本地服务端口
  port: ${GATEWAY_SERVER_PORT:8000}

spring:
  application:
    # 服务标识，用于服务注册与链路追踪
    name: gateway-service
  config:
    import:
      # 导入 Nacos 远程配置中心中的网关配置（路由、白名单、Redis等由 Nacos 统一管理），开启动态刷新
      - "optional:nacos:MPR-Gateway-dev.yaml?refreshEnabled=true"
  cloud:
    nacos:
      # Nacos 注册中心地址
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      # Nacos 配置中心地址
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_SERVER_NAMESPACE:media-platform-dev}
        group: ${NACOS_SERVER_GROUP:DEFAULT_GROUP}
      # Nacos 认证凭据，优先读取环境变量，默认回退至本地开发环境安全密码
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos}
