server:
  port: 8000

spring:
  application:
    name: gateway-service
  config:
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/content/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/api/interactions/**
        - id: recommend-service
          uri: lb://recommend-service
          predicates:
            - Path=/api/recommend/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
