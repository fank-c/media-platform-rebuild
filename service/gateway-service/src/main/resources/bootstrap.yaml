spring:
  application:
    # 服务标识，用于服务注册与链路追踪
    name: gateway-service

  cloud:
    # Nacos 配置中心地址
    config:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      shared-configs:
        - data-id: MPR-Gateway-dev.yaml
          group: DEFAULT_GROUP
          refresh: true
      # Nacos 认证凭据，优先读取环境变量，默认回退至本地开发环境安全密码
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos}
      namespace: ${NACOS_SERVER_NAMESPACE:media-platform-dev}
      group: ${NACOS_SERVER_GROUP:DEFAULT_GROUP}