server:
  port: ${INTERACTION_SERVER_PORT:8500}
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: interaction-service
  config:
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_SERVER_USERNAME:nacos}
      password: ${NACOS_SERVER_PASSWORD:nacos_password}
  datasource:
    url: ${INTERACTION_DB_URL:jdbc:mysql://localhost:3306/media_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${INTERACTION_DB_USERNAME:media}
    password: ${INTERACTION_DB_PASSWORD:media}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:media}
    password: ${RABBITMQ_PASSWORD:media}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 消费端限流：单消费者预取上限，避免元数据事件堆积时压垮应用
        prefetch: ${RABBITMQ_LISTENER_PREFETCH:20}
        # 业务异常时由容器重试，重试耗尽后拒收并按队列死信配置转入死信队列，避免毒消息无限重投
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_LISTENER_MAX_ATTEMPTS:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 互动统计计数与 Outbox 事件发件箱相关配置
interaction:
  counter:
    # 待汇总增量批处理间隔；公开统计只读取已汇总的数据库计数
    flush-rate-ms: ${INTERACTION_COUNTER_FLUSH_RATE_MS:5000}
    batch-size: 500
    cleanup-rate-ms: 3600000
    retention-days: 7
  watch:
    # 观看会话超时时间，无心跳超过此时长视为结束旧会话并开启新会话，默认 30 分钟 (30m)
    session-timeout: ${INTERACTION_WATCH_SESSION_TIMEOUT:30m}
    # 同一用户针对同一视频防重复累加播放量的冷却周期，默认 6 小时 (6h)
    repeat-window: ${INTERACTION_WATCH_REPEAT_WINDOW:6h}
    # 判定为单次有效播放的当前会话观看时长门槛，与 30% 时长门槛取较大值，默认 5 秒 (5s)
    valid-play-threshold: ${INTERACTION_WATCH_VALID_PLAY_THRESHOLD:5s}
    # 单次心跳允许计入的最大有效增量时长，超出部分截断，默认 15 秒 (15s)
    max-heartbeat-delta: ${INTERACTION_WATCH_MAX_HEARTBEAT_DELTA:15s}
    # 增量时间校验容差：客户端增量不得超过服务端两次心跳间隔加该容差（默认 2s）
    heartbeat-credit-tolerance: ${INTERACTION_WATCH_HEARTBEAT_CREDIT_TOLERANCE:2s}
    # 播放量资格的时长比例门槛，0.30 表示 30%
    qualification-ratio: ${INTERACTION_WATCH_QUALIFICATION_RATIO:0.30}
    # 完播判定的位置与有效时长比例门槛，0.90 表示双 90% 条件
    completion-ratio: ${INTERACTION_WATCH_COMPLETION_RATIO:0.90}
    # 观看会话、事件凭据与已隐藏进度的保留期，默认 30 天 (30d)
    retention: ${INTERACTION_WATCH_RETENTION:30d}
    # 单次保留期清理最多处理的行数
    cleanup-batch-size: ${INTERACTION_WATCH_CLEANUP_BATCH_SIZE:500}
    # 保留期清理任务间隔
    cleanup-rate-ms: ${INTERACTION_WATCH_CLEANUP_RATE_MS:3600000}
  outbox:
    # 是否启用发件箱事件持久化写入能力
    enabled: ${INTERACTION_OUTBOX_ENABLED:true}
    # 是否开启向 RabbitMQ 的正式自动派发 (默认关闭，当下游推荐模块队列就绪后再开放)
    dispatch-enabled: ${INTERACTION_OUTBOX_DISPATCH_ENABLED:false}
    # 事务提交后是否毫秒级快速唤醒派发线程
    fast-dispatch-enabled: ${INTERACTION_OUTBOX_FAST_DISPATCH_ENABLED:false}
    # 单次批处理扫描与拉取的事件记录上限
    batch-size: ${INTERACTION_OUTBOX_BATCH_SIZE:100}
    # 最大允许重试次数，超限则标记为 FAILED 并进入告警出口
    max-attempts: ${INTERACTION_OUTBOX_MAX_ATTEMPTS:20}
    # 等待 RabbitMQ Broker Confirm 回执的有界超时时间
    confirm-timeout: ${INTERACTION_OUTBOX_CONFIRM_TIMEOUT:5s}
    # 分布式单实例抢占租约锁定时长
    lease: ${INTERACTION_OUTBOX_LEASE:30s}
    # 后台定时扫描兜底间隔
    poll-interval: ${INTERACTION_OUTBOX_POLL_INTERVAL:5s}
    # 停机等待派发任务优雅终止的最大等待时间
    shutdown-await: ${INTERACTION_OUTBOX_SHUTDOWN_AWAIT:10s}
    # 是否清理超过保留期的已发布记录，默认关闭以便先完成环境验证
    cleanup-enabled: ${INTERACTION_OUTBOX_CLEANUP_ENABLED:false}
    # 已发布记录保留期，以 published_at 为起点
    retention: ${INTERACTION_OUTBOX_RETENTION:30d}
    # 单批清理上限
    cleanup-batch-size: ${INTERACTION_OUTBOX_CLEANUP_BATCH_SIZE:500}
    # 单次调度最多清理批次数
    cleanup-max-batches: ${INTERACTION_OUTBOX_CLEANUP_MAX_BATCHES:10}
    # 清理任务间隔
    cleanup-interval: ${INTERACTION_OUTBOX_CLEANUP_INTERVAL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # 控制台彩色输出：时间/线程弱化(faint)、级别自适应着色(%5p)、traceId洋红高亮(magenta)、类名青色(cyan)
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}]){magenta} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
