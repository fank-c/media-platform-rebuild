server:
  port: ${RECOMMEND_SERVER_PORT:8600}
spring:
  application:
    name: recommend-service
  config:
    import: "optional:nacos:application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:media}
    password: ${RABBITMQ_PASSWORD:media}
management:
  endpoints:
    web:
      exposure:
        include: health,info
